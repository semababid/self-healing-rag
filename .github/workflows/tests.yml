name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Run both versions to the end, so a failure on one doesn't hide the other's result.
      fail-fast: false
      matrix:
        # The oldest and newest supported versions. Streamlit needs 3.11 or newer.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.lock
      # Exact versions from the lock file, so CI tests what users install. The
      # extra index has the CPU build of PyTorch that the lock pins on Linux.
      - run: pip install -r requirements-dev.lock --extra-index-url https://download.pytorch.org/whl/cpu
      - run: pytest -v
