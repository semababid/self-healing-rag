name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Run both versions to the end, so a failure on one doesn't hide the other's result.
      fail-fast: false
      matrix:
        # The oldest and newest supported versions. Streamlit needs 3.11 or newer.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      # The tests don't need a GPU. Installing the CPU build of PyTorch first
      # avoids downloading the much larger CUDA build.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-dev.txt
      - run: pytest -v
